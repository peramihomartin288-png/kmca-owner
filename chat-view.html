        function showUploadProgress(filename, type) {
            const icons = {
                image: 'fa-image',
                video: 'fa-video',
                file: 'fa-file',
                voice: 'fa-microphone'
            };
            
            els.uploadIcon.innerHTML = `<i class="fas ${icons[type] || 'fa-cloud-upload-alt'}"></i>`;
            els.uploadName.textContent = filename;
            els.uploadFill.style.width = '0%';
            els.uploadPercent.textContent = '0%';
            els.uploadProgress.classList.add('show');
        }
        
        function updateUploadProgress(percent) {
            els.uploadFill.style.width = percent + '%';
            els.uploadPercent.textContent = percent + '%';
        }
        
        function hideUploadProgress() {
            setTimeout(() => els.uploadProgress.classList.remove('show'), 500);
        }
        
        // ═══════════════════════════════════════════════════════════
        // SEND TEXT
        // ═══════════════════════════════════════════════════════════
        
        async function sendMessage() {
            const text = els.messageInput.value.trim();
            if (!text) return;
            
            els.sendBtn.disabled = true;
            
            try {
                const mentions = extractMentions(text);
                
                const msgData = {
                    chat_id: state.chatId,
                    sender_id: state.owner.id,
                    sender_name: state.owner.jina,
                    message: text,
                    message_type: 'text',
                    mentions: mentions,
                    reply_to_id: state.replyTo?.id || null
                };
                
                const { data, error } = await supabaseClient
                    .from('owner_chat_messages')
                    .insert([msgData])
                    .select();
                
                if (error) throw error;
                
                els.messageInput.value = '';
                els.messageInput.style.height = 'auto';
                updateInputBar();
                clearReply();
                stopTyping();
                
                if (mentions.length > 0) {
                    await sendMentionNotifications(mentions, text);
                }
                
                if (data && data[0] && !state.messages.find(m => m.id === data[0].id)) {
                    state.messages.push(data[0]);
                    renderMessages();
                }
                
                state.autoScroll = true;
                scrollToBottom(true);
                
            } catch (error) {
                console.error('Send error:', error);
                showToast('Imeshindikana: ' + error.message, 'error');
            } finally {
                els.sendBtn.disabled = false;
                els.messageInput.focus();
            }
        }
        
        function updateInputBar() {
            const hasText = els.messageInput.value.trim().length > 0;
            els.inputBar.classList.toggle('has-text', hasText);
        }
        
        function extractMentions(text) {
            const mentions = [];
            const regex = /@(\w+)/g;
            let match;
            
            while ((match = regex.exec(text)) !== null) {
                const namePart = match[1].toLowerCase();
                const owner = state.allOwners.find(o => 
                    o.jina && o.jina.toLowerCase().startsWith(namePart)
                );
                if (owner && !mentions.includes(owner.id)) {
                    mentions.push(owner.id);
                }
            }
            
            return mentions;
        }
        
        async function sendMentionNotifications(mentions, text) {
            try {
                for (const ownerId of mentions) {
                    await supabaseClient.from('notifications').insert([{
                        user_id: ownerId,
                        title: `📣 ${state.owner.jina} amekutaja`,
                        message: text.substring(0, 100),
                        type: 'mention',
                        is_read: false,
                        created_at: new Date().toISOString()
                    }]);
                }
            } catch (e) {}
        }
        
        // ═══════════════════════════════════════════════════════════
        // REACTIONS / DELETE
        // ═══════════════════════════════════════════════════════════
        
        async function toggleReaction(messageId, emoji) {
            try {
                const msg = state.messages.find(m => m.id === messageId);
                if (!msg) return;
                
                const reactions = { ...(msg.reactions || {}) };
                const users = reactions[emoji] || [];
                
                if (users.includes(state.owner.id)) {
                    reactions[emoji] = users.filter(id => id !== state.owner.id);
                    if (reactions[emoji].length === 0) delete reactions[emoji];
                } else {
                    reactions[emoji] = [...users, state.owner.id];
                }
                
                await supabaseClient
                    .from('owner_chat_messages')
                    .update({ reactions })
                    .eq('id', messageId);
                
                msg.reactions = reactions;
                renderMessages();
                closeActionsSheet();
            } catch (error) {
                showToast('Imeshindikana: ' + error.message, 'error');
            }
        }
        
        async function deleteMessage(messageId) {
            showConfirm('Futa Ujumbe?', 'Ujumbe utafutwa kwa kila mtu.', async () => {
                try {
                    const { error } = await supabaseClient
                        .from('owner_chat_messages')
                        .update({
                            is_deleted: true,
                            deleted_by: state.owner.id,
                            message: '[Ujumbe umefutwa]'
                        })
                        .eq('id', messageId);
                    
                    if (error) throw error;
                    showToast('Ujumbe umefutwa', 'success');
                    closeActionsSheet();
                } catch (error) {
                    showToast('Imeshindikana: ' + error.message, 'error');
                }
            });
        }
        
        // ═══════════════════════════════════════════════════════════
        // TYPING / PRESENCE
        // ═══════════════════════════════════════════════════════════
        
        async function sendTyping() {
            if (state.isTyping) return;
            state.isTyping = true;
            try {
                await supabaseClient.from('owner_chat_typing').upsert({
                    chat_id: state.chatId,
                    owner_id: state.owner.id,
                    owner_name: state.owner.jina,
                    is_typing: true,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'chat_id,owner_id' });
            } catch (e) {}
        }
        
        async function stopTyping() {
            if (!state.isTyping) return;
            state.isTyping = false;
            try {
                await supabaseClient.from('owner_chat_typing').upsert({
                    chat_id: state.chatId,
                    owner_id: state.owner.id,
                    owner_name: state.owner.jina,
                    is_typing: false,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'chat_id,owner_id' });
            } catch (e) {}
        }
        
        async function markMessagesRead() {
            try {
                const unread = state.messages.filter(m => 
                    m.sender_id !== state.owner.id &&
                    !(m.read_by || []).includes(state.owner.id)
                );
                
                for (const msg of unread) {
                    const readBy = [...(msg.read_by || []), state.owner.id];
                    await supabaseClient
                        .from('owner_chat_messages')
                        .update({ read_by: readBy })
                        .eq('id', msg.id);
                }
            } catch (error) {}
        }
        
        async function updatePresence(isOnline) {
            if (!state.owner) return;
            try {
                await supabaseClient.from('owner_chat_presence').upsert({
                    owner_id: state.owner.id,
                    owner_name: state.owner.jina,
                    is_online: isOnline,
                    last_seen: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                }, { onConflict: 'owner_id' });
            } catch (e) {}
        }
        
        // ═══════════════════════════════════════════════════════════
        // REALTIME
        // ═══════════════════════════════════════════════════════════
        
        function subscribeToRealtime() {
            state.subscriptions.messages = supabaseClient
                .channel(`chat-msgs-${state.chatId}`)
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'owner_chat_messages',
                    filter: `chat_id=eq.${state.chatId}`
                }, handleMessageChange)
                .subscribe();
            
            state.subscriptions.typing = supabaseClient
                .channel(`chat-typing-${state.chatId}`)
                .on('postgres_changes', {
                    event: '*',
                    schema: 'public',
                    table: 'owner_chat_typing',
                    filter: `chat_id=eq.${state.chatId}`
                }, handleTypingChange)
                .subscribe();
            
            if (state.chat?.chat_type === 'direct' && state.otherOwner) {
                state.subscriptions.presence = supabaseClient
                    .channel(`chat-presence-${state.otherOwner.id}`)
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'owner_chat_presence',
                        filter: `owner_id=eq.${state.otherOwner.id}`
                    }, handlePresenceChange)
                    .subscribe();
            }
        }
        
        function handleMessageChange(payload) {
            const msg = payload.new || payload.old;
            if (!msg) return;
            
            if (payload.eventType === 'INSERT') {
                if (state.messages.find(m => m.id === msg.id)) return;
                
                state.messages.push(msg);
                renderMessages();
                
                if (!document.hidden) {
                    setTimeout(() => markMessagesRead(), 500);
                }
                
                // Notify kama si yetu
                if (msg.sender_id !== state.owner.id && window.ChatNotifications) {
                    ChatNotifications.notifyNewMessage(msg, {
                        senderAvatar: state.otherOwner?.profile_picture
                    });
                }
            } else if (payload.eventType === 'UPDATE') {
                const index = state.messages.findIndex(m => m.id === msg.id);
                if (index !== -1) {
                    state.messages[index] = msg;
                    renderMessages();
                }
            } else if (payload.eventType === 'DELETE') {
                state.messages = state.messages.filter(m => m.id !== msg.id);
                renderMessages();
            }
        }
        
        function handleTypingChange(payload) {
            const t = payload.new;
            if (!t || t.owner_id === state.owner.id) return;
            
            if (t.is_typing) {
                els.headerStatus.textContent = `${t.owner_name} anaandika...`;
                els.headerStatus.className = 'typing';
                if (state.chat?.chat_type === 'group') {
                    els.typingIndicator.classList.add('show');
                }
                clearTimeout(window._typingTimeout);
                window._typingTimeout = setTimeout(() => {
                    updateHeaderStatus();
                    els.typingIndicator.classList.remove('show');
                }, 4000);
            } else {
                updateHeaderStatus();
                els.typingIndicator.classList.remove('show');
            }
        }
        
        function handlePresenceChange(payload) {
            const p = payload.new;
            if (!p) return;
            state.presence[p.owner_id] = p;
            updateHeaderStatus();
        }
        
        // ═══════════════════════════════════════════════════════════
        // SETUP EVENTS
        // ═══════════════════════════════════════════════════════════
        
        function setupEvents() {
            // Input
            let inputTimer;
            els.messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
                updateInputBar();
                
                clearTimeout(inputTimer);
                sendTyping();
                inputTimer = setTimeout(stopTyping, 2000);
                
                handleMentionsInput(this.value);
            });
            
            els.messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    if (els.messageInput.value.trim()) sendMessage();
                }
            });
            
            els.sendBtn.addEventListener('click', sendMessage);
            
            // MIC BUTTON - One tap to record, tap again to send
            els.micBtn.addEventListener('click', toggleVoiceRecording);
            
            // Attach
            els.attachBtn.addEventListener('click', () => {
                if (els.messageInput.value.trim()) {
                    sendMessage();
                } else {
                    els.attachMenu.classList.toggle('show');
                }
            });
            
            // Long press attach → voice
            let attachPressTimer;
            els.attachBtn.addEventListener('touchstart', () => {
                if (els.messageInput.value.trim()) return;
                attachPressTimer = setTimeout(() => {
                    if (navigator.vibrate) navigator.vibrate(20);
                    els.attachMenu.classList.remove('show');
                    if (!state.isRecording) toggleVoiceRecording();
                }, 500);
            }, { passive: true });
            
            els.attachBtn.addEventListener('touchend', () => {
                clearTimeout(attachPressTimer);
                if (state.isRecording) toggleVoiceRecording();
            }, { passive: true });
            
            els.attachBtn.addEventListener('touchmove', () => clearTimeout(attachPressTimer), { passive: true });
            
            // Attach menu
            els.attachMenu.querySelectorAll('.attach-item').forEach(item => {
                item.addEventListener('click', () => {
                    const type = item.getAttribute('data-type');
                    els.attachMenu.classList.remove('show');
                    
                    const input = document.createElement('input');
                    input.type = 'file';
                    
                    if (type === 'image') input.accept = 'image/*';
                    else if (type === 'video') input.accept = 'video/*';
                    else input.accept = '*/*';
                    
                    input.addEventListener('change', async (e) => {
                        const file = e.target.files[0];
                        if (file) await uploadAndSendAttachment(file, type);
                    });
                    
                    input.click();
                });
            });
            
            document.addEventListener('click', (e) => {
                if (!els.attachBtn.contains(e.target) && !els.attachMenu.contains(e.target)) {
                    els.attachMenu.classList.remove('show');
                }
            });
            
            // Reply
            els.replyPreviewClose.addEventListener('click', clearReply);
            
            // Scroll
            els.messagesContainer.addEventListener('scroll', () => {
                const container = els.messagesContainer;
                const isNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
                state.autoScroll = isNearBottom;
                els.scrollBottomBtn.classList.toggle('show', !isNearBottom);
            });
            
            els.scrollBottomBtn.addEventListener('click', () => {
                state.autoScroll = true;
                scrollToBottom(true);
            });
            
            // Calls
            els.audioCallBtn.addEventListener('click', () => {
                if (!state.otherOwner || !window.ChatWebRTC) return;
                ChatWebRTC.startCall(state.otherOwner.id, state.otherOwner.jina, 'audio');
            });
            
            els.videoCallBtn.addEventListener('click', () => {
                if (!state.otherOwner || !window.ChatWebRTC) return;
                ChatWebRTC.startCall(state.otherOwner.id, state.otherOwner.jina, 'video');
            });
            
            els.menuBtn.addEventListener('click', () => {
                if (window.ChatNotifications) {
                    const muted = ChatNotifications.isChatMuted(state.chatId);
                    if (muted) {
                        ChatNotifications.unmuteChat(state.chatId);
                        showToast('Umewasha notifications', 'success');
                    } else {
                        ChatNotifications.muteChat(state.chatId);
                        showToast('Umefunga notifications za chat hii', 'info');
                    }
                }
            });
            
            // Actions sheet
            els.actionsSheet.addEventListener('click', (e) => {
                if (e.target === els.actionsSheet) closeActionsSheet();
            });
            
            els.reactionsPicker.querySelectorAll('.reaction-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const emoji = btn.getAttribute('data-emoji');
                    if (state.viewingMessage) toggleReaction(state.viewingMessage.id, emoji);
                });
            });
            
            els.actionList.querySelectorAll('.action-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const action = btn.getAttribute('data-action');
                    if (!state.viewingMessage) return;
                    
                    if (action === 'reply') {
                        setReplyTo(state.viewingMessage);
                        closeActionsSheet();
                    } else if (action === 'copy') {
                        copyMessageText(state.viewingMessage);
                        closeActionsSheet();
                    } else if (action === 'delete') {
                        deleteMessage(state.viewingMessage.id);
                    }
                });
            });
            
            // Lightbox
            els.lightboxClose.addEventListener('click', closeLightbox);
            els.lightbox.addEventListener('click', (e) => {
                if (e.target === els.lightbox) closeLightbox();
            });
            
            // Confirm
            els.confirmCancel.addEventListener('click', hideConfirm);
            els.confirmOk.addEventListener('click', async () => {
                const cb = confirmCallback;
                hideConfirm();
                if (cb) await cb();
            });
            
            els.confirmModal.addEventListener('click', (e) => {
                if (e.target === els.confirmModal) hideConfirm();
            });
            
            // Visibility
            document.addEventListener('visibilitychange', async () => {
                await updatePresence(!document.hidden);
                if (!document.hidden) await markMessagesRead();
            });
            
            window.addEventListener('beforeunload', () => {
                updatePresence(false);
                stopTyping();
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeActionsSheet();
                    closeLightbox();
                    hideConfirm();
                }
            });
        }
        
        // ═══════════════════════════════════════════════════════════
        // HELPERS
        // ═══════════════════════════════════════════════════════════
        
        function openActionsSheet(msg) {
            state.viewingMessage = msg;
            const canDelete = msg.sender_id === state.owner.id || state.owner.is_super_admin;
            els.deleteActionBtn.style.display = canDelete ? 'flex' : 'none';
            els.actionsSheet.classList.add('show');
        }
        
        function closeActionsSheet() {
            els.actionsSheet.classList.remove('show');
            state.viewingMessage = null;
        }
        
        function setReplyTo(msg) {
            state.replyTo = msg;
            els.replyPreviewName.textContent = msg.sender_name || 'Unknown';
            els.replyPreviewText.textContent = getMessagePreview(msg);
            els.replyPreview.classList.add('show');
            els.messageInput.focus();
        }
        
        function clearReply() {
            state.replyTo = null;
            els.replyPreview.classList.remove('show');
        }
        
        function scrollToMessage(messageId) {
            const el = document.querySelector(`[data-message-id="${messageId}"]`);
            if (el) {
                el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                el.style.background = 'var(--primary-soft)';
                setTimeout(() => el.style.background = '', 1500);
            }
        }
        
        function scrollToBottom(smooth = true) {
            els.messagesContainer.scrollTo({
                top: els.messagesContainer.scrollHeight,
                behavior: smooth ? 'smooth' : 'auto'
            });
            els.scrollBottomBtn.classList.remove('show');
        }
        
        function openLightbox(url) {
            els.lightboxImg.src = url;
            els.lightbox.classList.add('show');
        }
        
        function closeLightbox() {
            els.lightbox.classList.remove('show');
            els.lightboxImg.src = '';
        }
        
        let confirmCallback = null;
        
        function showConfirm(title, message, callback) {
            els.confirmTitle.textContent = title;
            els.confirmMessage.textContent = message;
            els.confirmModal.classList.add('active');
            confirmCallback = callback;
        }
        
        function hideConfirm() {
            els.confirmModal.classList.remove('active');
            confirmCallback = null;
        }
        
        async function copyMessageText(msg) {
            const text = msg.message || msg.attachment_url || '';
            try {
                await navigator.clipboard.writeText(text);
                showToast('Imenakiliwa!', 'success');
            } catch (e) {
                showToast('Imeshindikana', 'error');
            }
        }
        
        function handleMentionsInput(text) {
            const cursorPos = els.messageInput.selectionStart;
            const textBefore = text.substring(0, cursorPos);
            const lastAt = textBefore.lastIndexOf('@');
            
            if (lastAt === -1) {
                els.mentionsAutocomplete.classList.remove('show');
                return;
            }
            
            const afterAt = textBefore.substring(lastAt + 1);
            if (afterAt.includes(' ') || afterAt.includes('\n')) {
                els.mentionsAutocomplete.classList.remove('show');
                return;
            }
            
            const query = afterAt.toLowerCase();
            const matches = state.allOwners
                .filter(o => o.jina && o.jina.toLowerCase().includes(query))
                .slice(0, 5);
            
            if (matches.length === 0) {
                els.mentionsAutocomplete.classList.remove('show');
                return;
            }
            
            els.mentionsAutocomplete.innerHTML = matches.map(o => {
                const initials = getInitials(o.jina);
                const hasPic = o.profile_picture && 
                               o.profile_picture !== 'null' && 
                               o.profile_picture.trim() !== '';
                
                const avatarHtml = hasPic
                    ? `<img src="${o.profile_picture}" onerror="this.parentElement.textContent='${initials}'">`
                    : initials;
                
                return `
                    <div class="mention-item" data-owner-name="${escapeAttr(o.jina)}">
                        <div class="mention-avatar">${avatarHtml}</div>
                        <div class="mention-name">${escapeHtml(o.jina)}</div>
                    </div>
                `;
            }).join('');
            
            els.mentionsAutocomplete.classList.add('show');
            
            els.mentionsAutocomplete.querySelectorAll('.mention-item').forEach(item => {
                item.addEventListener('click', () => {
                    const ownerName = item.getAttribute('data-owner-name');
                    insertMention(ownerName, lastAt, cursorPos);
                });
            });
        }
        
        function insertMention(ownerName, atPos, cursorPos) {
            const text = els.messageInput.value;
            const before = text.substring(0, atPos);
            const after = text.substring(cursorPos);
            const firstName = ownerName.split(' ')[0];
            const newText = `${before}@${firstName} ${after}`;
            
            els.messageInput.value = newText;
            els.mentionsAutocomplete.classList.remove('show');
            
            const newCursorPos = atPos + firstName.length + 2;
            els.messageInput.setSelectionRange(newCursorPos, newCursorPos);
            els.messageInput.focus();
            els.messageInput.dispatchEvent(new Event('input'));
        }
        
        async function cleanupOldMedia() {
            try {
                await supabaseClient.rpc('cleanup_old_chat_media');
            } catch (e) {}
        }
        
        function getMessagePreview(msg) {
            switch (msg.message_type) {
                case 'image': return '🖼️ Picha';
                case 'video': return '🎥 Video';
                case 'file': return '📎 ' + (msg.attachment_name || 'File');
                case 'voice': return '🎤 Voice note';
                default: return msg.message || '';
            }
        }
        
        function formatTextWithMentions(text) {
            if (!text) return '';
            let escaped = escapeHtml(text);
            escaped = escaped.replace(/@(\w+)/g, '<span class="mention">@$1</span>');
            return escaped;
        }
        
        function getInitials(j) {
            if (!j) return '??';
            const c = j.trim().replace(/\s+/g, ' ');
            const n = c.split(' ');
            if (n.length >= 2) return (n[0][0] + n[1][0]).toUpperCase();
            if (n.length === 1 && n[0].length >= 2) return n[0].substring(0, 2).toUpperCase();
            return '??';
        }
        
        function escapeHtml(t) {
            if (!t) return '';
            const d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }
        
        function escapeAttr(t) {
            if (!t) return '';
            return String(t).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        function formatDuration(seconds) {
            if (!seconds) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }
        
        function formatMessageTime(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleTimeString('sw-TZ', { hour: '2-digit', minute: '2-digit' });
        }
        
        function formatLastSeen(dateString) {
            if (!dateString) return 'Haijulikani';
            const date = new Date(dateString);
            const now = new Date();
            const diffMins = Math.floor((now - date) / 60000);
            const diffHours = Math.floor((now - date) / 3600000);
            const diffDays = Math.floor((now - date) / 86400000);
            
            if (diffMins < 1) return 'Sasa hivi';
            if (diffMins < 60) return `Dakika ${diffMins} zilizopita`;
            if (diffHours < 24) return `Saa ${diffHours} zilizopita`;
            if (diffDays === 1) return 'Jana';
            if (diffDays < 7) return `Siku ${diffDays} zilizopita`;
            return date.toLocaleDateString('sw-TZ', { day: 'numeric', month: 'short' });
        }
        
        function showToast(msg, type = 'success') {
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            els.toast.className = 'toast ' + type;
            els.toast.querySelector('i').className = 'fas ' + (icons[type] || icons.success);
            els.toastText.textContent = msg;
            els.toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => els.toast.classList.remove('show'), 3000);
        }
        
        function ready(fn) {
            if (document.readyState !== 'loading') fn();
            else document.addEventListener('DOMContentLoaded', fn);
        }
        
        ready(init);
        
        console.log('✅ OWNER_CHAT_VIEW loaded');
    })();
    </script>
</body>
