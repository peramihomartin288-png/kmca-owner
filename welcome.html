<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karibu - KMCA Owner</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="owner-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="KMCA Owner">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="favicon.ico">
</head>
<body class="welcome-body">
    
    <div class="welcome-container">
        <div class="welcome-card">
            <!-- Avatar -->
            <div class="welcome-avatar" id="ownerAvatar">??</div>
            
            <!-- Title -->
            <h2 class="welcome-title">Karibu <span id="ownerName">Owner</span>!</h2>
            <p class="welcome-subtitle">KMCA Owner Panel</p>
            
            <!-- Icon -->
            <div class="welcome-icon">
                <i class="fas fa-shield-alt"></i>
            </div>
            
            <!-- Sessions -->
            <div class="welcome-sessions">
                <h4>Uwezo wako:</h4>
                <div id="sessionsList">
                    <span class="session-tag">Full Access</span>
                </div>
            </div>
            
            <!-- Continue Button -->
            <button class="btn-continue" id="continueBtn">
                Endelea kwenye Dashboard
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
        
        <!-- Footer from Supabase -->
        <div id="footerContent" style="text-align: center; margin-top: 20px; color: #94a3b8; font-size: 12px;">
            <p>Inapakia footer...</p>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ctzdiiyzoocxmlmeagtt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emRpaXl6b29jeG1sbWVhZ3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjI1NTEsImV4cCI6MjEwMjY5ODU1MX0.Jy_T5XaI5CI4qfFVH7b53MDCurR2olh0a6Tx9BzDOGw';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <!-- JavaScript -->
    <script src="auth.js"></script>
    <script src="service-worker-register.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function() {
            const owner = getCurrentOwner();
            
            if (!owner) {
                window.location.href = 'index.html';
                return;
            }
            
            // Avatar
            const names = owner.jina.split(' ');
            let avatarText = '??';
            if (names.length >= 2) avatarText = (names[0][0] + names[1][0]).toUpperCase();
            else if (names.length === 1) avatarText = names[0].substring(0, 2).toUpperCase();
            
            document.getElementById('ownerAvatar').textContent = avatarText;
            document.getElementById('ownerName').textContent = owner.jina.split(' ')[0];
            
            // Load sessions
            try {
                const { data: sessions } = await supabaseClient
                    .from('owner_sessions')
                    .select('session_type')
                    .eq('owner_id', owner.id);
                
                const sessionLabels = {
                    'full_access': 'Full Access',
                    'manage_posts': 'Posts Management',
                    'manage_events': 'Events Management',
                    'manage_polls': 'Polls Management',
                    'manage_bible_verses': 'Bible Verses',
                    'manage_watakatifu': 'Watakatifu',
                    'manage_nyimbo': 'Nyimbo za Siku',
                    'manage_masomo': 'Masomo ya Dominica',
                    'manage_questions': 'Questions',
                    'manage_users': 'Users',
                    'manage_announcements': 'Announcements',
                    'manage_media': 'Media',
                    'manage_backup': 'Backup & Clean',
                    'manage_urls': 'URL Management',
                    'manage_pwa': 'PWA Management',
                    'manage_ai_schedules': 'AI Schedules',
                    'manage_auto_play': 'Auto-Play Video',
                    'manage_owners': 'Owners',
                    'manage_settings': 'Settings'
                };
                
                const sessionsList = document.getElementById('sessionsList');
                sessionsList.innerHTML = '';
                
                if (sessions && sessions.length > 0) {
                    sessions.forEach(function(session) {
                        const tag = document.createElement('span');
                        tag.className = 'session-tag';
                        tag.textContent = sessionLabels[session.session_type] || session.session_type;
                        sessionsList.appendChild(tag);
                    });
                } else if (owner.is_super_admin) {
                    const tag = document.createElement('span');
                    tag.className = 'session-tag';
                    tag.textContent = '👑 Super Admin - Full Access';
                    sessionsList.appendChild(tag);
                }
            } catch (e) {
                console.log('Sessions not found');
            }
            
            // Load footer from Supabase
            await loadFooter();
        });
        
        // Function to load footer from Supabase
        async function loadFooter() {
            try {
                const { data: footer, error } = await supabaseClient
                    .from('footer')
                    .select('*')
                    .limit(1)
                    .single();
                
                const footerContent = document.getElementById('footerContent');
                
                if (footer) {
                    footerContent.innerHTML = 
                        '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">' +
                        (footer.mawasiliano || '') +
                        '</p>' +
                        (footer.email ? '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">📧 ' + footer.email + '</p>' : '') +
                        (footer.phone ? '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">📞 ' + footer.phone + '</p>' : '') +
                        '<p style="color: #94a3b8; font-size: 12px; margin-top: 8px;">' +
                        (footer.copyright || '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis') +
                        '</p>';
                } else {
                    footerContent.innerHTML = 
                        '<p style="color: #94a3b8; font-size: 12px;">' +
                        '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis' +
                        '</p>';
                }
            } catch (e) {
                console.log('Footer not found, using default');
                document.getElementById('footerContent').innerHTML = 
                    '<p style="color: #94a3b8; font-size: 12px;">' +
                    '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis' +
                    '</p>';
            }
        }
        
        document.getElementById('continueBtn').addEventListener('click', function() {
            window.location.href = 'dashboard.html';
        });
    </script>
    
    <!-- Additional Styles for Welcome Page -->
    <style>
        .welcome-body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
        }
        
        .welcome-container {
            width: 100%;
            max-width: 450px;
            padding: 24px;
        }
        
        .welcome-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.3);
            animation: modalIn 0.3s ease;
        }
        
        .welcome-avatar {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, #2563eb, #d4af37);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 700;
            color: #fff;
        }
        
        .welcome-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .welcome-subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 16px;
        }
        
        .welcome-icon {
            width: 60px;
            height: 60px;
            margin: 16px auto;
            background: rgba(37, 99, 235, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #2563eb;
        }
        
        .welcome-sessions {
            margin: 16px 0;
        }
        
        .welcome-sessions h4 {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .session-tag {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: #d4af37;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 500;
            margin: 2px;
        }
        
        .btn-continue {
            width: 100%;
            padding: 14px;
            margin-top: 16px;
            background: linear-gradient(135deg, #2563eb, #d4af37);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-continue:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</body>
</html>
