<body class="dashboard-body">
    
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo"><i class="fas fa-church"></i></div>
            <h3>KMCA Owner</h3>
        </div>
        <div class="sidebar-menu">
            <div class="sidebar-item" data-page="dashboard"><i class="fas fa-home"></i><span>Dashboard</span></div>
            <div class="sidebar-item" data-page="posts"><i class="fas fa-newspaper"></i><span>Posts</span></div>
            <div class="sidebar-item" data-page="events"><i class="fas fa-calendar"></i><span>Matukio</span></div>
            <div class="sidebar-item" data-page="polls"><i class="fas fa-vote-yea"></i><span>Polls</span></div>
            <div class="sidebar-item" data-page="bible-verses"><i class="fas fa-bible"></i><span>Bible Verses</span></div>
            <div class="sidebar-item" data-page="watakatifu"><i class="fas fa-cross"></i><span>Watakatifu</span></div>
            <div class="sidebar-item" data-page="nyimbo"><i class="fas fa-music"></i><span>Nyimbo za Siku</span></div>
            <div class="sidebar-item" data-page="masomo"><i class="fas fa-book-open"></i><span>Masomo</span></div>
            <div class="sidebar-item" data-page="questions"><i class="fas fa-question-circle"></i><span>Questions</span></div>
            <div class="sidebar-item" data-page="users"><i class="fas fa-users"></i><span>Users</span></div>
            <div class="sidebar-item" data-page="announcements"><i class="fas fa-bullhorn"></i><span>Announcements</span></div>
            <div class="sidebar-item" data-page="ai-schedules"><i class="fas fa-robot"></i><span>AI Schedules</span></div>
            <div class="sidebar-item" data-page="auto-play-video"><i class="fas fa-play-circle"></i><span>Auto-Play Video</span></div>
            <div class="sidebar-item" data-page="media"><i class="fas fa-folder"></i><span>Media</span></div>
            <div class="sidebar-item active" data-page="backup-clean"><i class="fas fa-database"></i><span>Backup & Clean</span></div>
            <div class="sidebar-item" data-page="url-management"><i class="fas fa-link"></i><span>URL Management</span></div>
            <div class="sidebar-item" data-page="pwa-management"><i class="fas fa-mobile-alt"></i><span>PWA</span></div>
            <div class="sidebar-item" data-page="owners"><i class="fas fa-user-shield"></i><span>Owners</span></div>
            <div class="sidebar-item" data-page="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
            <div class="sidebar-item sidebar-logout" id="logoutBtn"><i class="fas fa-sign-out-alt"></i><span>Log Out</span></div>
        </div>
    </div>

    <!-- Header -->
    <header class="dashboard-header">
        <button class="icon-btn" id="menuToggle"><i class="fas fa-bars"></i></button>
        <h2>Backup & Clean</h2>
    </header>

    <!-- Main Content -->
    <main class="dashboard-content">
        
        <!-- BACKUP SECTION -->
        <div class="hosting-monitor">
            <h4><i class="fas fa-download"></i> BACKUP</h4>
            
            <div class="backup-grid">
                <button class="backup-btn" data-table="users">
                    <i class="fas fa-users"></i>
                    <span>Users Backup</span>
                </button>
                <button class="backup-btn" data-table="posts">
                    <i class="fas fa-newspaper"></i>
                    <span>Posts Backup</span>
                </button>
                <button class="backup-btn" data-table="watakatifu">
                    <i class="fas fa-cross"></i>
                    <span>Watakatifu</span>
                </button>
                <button class="backup-btn" data-table="bible_verses">
                    <i class="fas fa-bible"></i>
                    <span>Bible Verses</span>
                </button>
                <button class="backup-btn" data-table="nyimbo_za_siku">
                    <i class="fas fa-music"></i>
                    <span>Nyimbo</span>
                </button>
                <button class="backup-btn" data-table="masomo_dominica">
                    <i class="fas fa-book-open"></i>
                    <span>Masomo</span>
                </button>
                <button class="backup-btn" data-table="all">
                    <i class="fas fa-database"></i>
                    <span>Backup Kamili</span>
                </button>
            </div>
        </div>
        
        <!-- CLEAN SECTION -->
        <div class="hosting-monitor" style="margin-top: 20px;">
            <h4><i class="fas fa-broom"></i> CLEAN</h4>
            
            <div class="clean-grid">
                <button class="clean-btn" data-action="notifications">
                    <i class="fas fa-bell-slash"></i>
                    <span>Futa Notifications</span>
                </button>
                <button class="clean-btn" data-action="activity">
                    <i class="fas fa-clock"></i>
                    <span>Futa Activity Logs</span>
                </button>
                <button class="clean-btn" data-action="comments">
                    <i class="fas fa-comment-slash"></i>
                    <span>Futa Comments</span>
                </button>
                <button class="clean-btn" data-action="past_events">
                    <i class="fas fa-calendar-times"></i>
                    <span>Futa Matukio Yaliyopita</span>
                </button>
                <button class="clean-btn" data-action="expired_polls">
                    <i class="fas fa-vote-yea"></i>
                    <span>Futa Polls Zilizoisha</span>
                </button>
                <button class="clean-btn" data-action="orphaned">
                    <i class="fas fa-broom"></i>
                    <span>Futa Orphaned Data</span>
                </button>
            </div>
        </div>
        
        <!-- DAILY CYCLE -->
        <div class="hosting-monitor" style="margin-top: 20px;">
            <h4><i class="fas fa-sync"></i> DAILY CYCLE</h4>
            <button class="btn-primary" id="runAllCyclesBtn">
                <i class="fas fa-play"></i>
                Run All Daily Cycles
            </button>
        </div>
        
    </main>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <div class="bottom-nav-item" data-page="dashboard"><i class="fas fa-home"></i><span>Home</span></div>
        <div class="bottom-nav-item" data-page="posts"><i class="fas fa-newspaper"></i><span>Posts</span></div>
        <div class="bottom-nav-item active" data-page="backup-clean"><i class="fas fa-database"></i><span>Backup</span></div>
        <div class="bottom-nav-item" data-page="settings"><i class="fas fa-cog"></i><span>Settings</span></div>
    </div>

    <script src="auth.js"></script>
    <script src="backup-clean.js"></script>
    <script src="service-worker-register.js"></script>
    
    <style>
        .backup-grid, .clean-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        
        .backup-btn, .clean-btn {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        
        .backup-btn:hover, .clean-btn:hover {
            border-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .backup-btn i, .clean-btn i {
            font-size: 24px;
            color: #d4af37;
        }
        
        .backup-btn span, .clean-btn span {
            font-size: 12px;
            font-weight: 500;
            color: #cbd5e1;
        }
        
        .clean-btn i {
            color: #ef4444;
        }
    </style>
</body>
