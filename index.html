<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login - KMCA</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="owner-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="KMCA Owner">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="favicon.ico">
</head>
<body class="login-body">
    
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="login-logo">
                <i class="fas fa-church"></i>
            </div>
            
            <!-- Title -->
            <h2 class="login-title">KMCA Owner Panel</h2>
            <p class="login-subtitle">Jukwaa la Usimamizi la Kitaalamu</p>
            
            <!-- Form -->
            <form id="loginForm" class="login-form">
                <!-- Phone (hidden initially, shows for non-super admin) -->
                <div class="form-group" id="phoneGroup" style="display: none;">
                    <label for="phone">
                        <i class="fas fa-phone"></i>
                        Namba ya Simu
                    </label>
                    <input type="tel" id="phone" placeholder="mfano: 0712345678" autocomplete="tel">
                </div>
                
                <!-- PIN -->
                <div class="form-group">
                    <label for="pin">
                        <i class="fas fa-lock"></i>
                        PIN
                    </label>
                    <input type="password" id="pin" maxlength="4" required placeholder="••••" autocomplete="current-password">
                </div>
                
                <!-- Login Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i>
                    Ingia
                </button>
                
                <!-- Forgot PIN -->
                <button type="button" class="btn-forgot" id="forgotPinBtn">
                    Umesahau PIN?
                </button>
            </form>
        </div>
        
        <!-- Footer from Supabase -->
        <div id="footerContent" style="text-align: center; margin-top: 20px; color: #94a3b8; font-size: 12px;">
            <p>Inapakia footer...</p>
        </div>
    </div>
    
    <!-- Forgot PIN Modal -->
    <div id="forgotPinModal" class="modal" style="display: none;">
        <div class="modal-content">
            <button class="modal-close" id="forgotPinClose">&times;</button>
            <h3>Umesahau PIN?</h3>
            <p style="color: #94a3b8; margin-bottom: 20px; font-size: 14px;">
                Weka namba ya simu uliyojisajili nayo
            </p>
            
            <div class="form-group">
                <label for="forgotPhone">
                    <i class="fas fa-phone"></i>
                    Namba ya Simu
                </label>
                <input type="tel" id="forgotPhone" placeholder="mfano: 0712345678">
            </div>
            
            <button class="btn-primary btn-block" id="showPinBtn">
                <i class="fas fa-key"></i>
                Onyesha PIN
            </button>
            
            <div id="pinResult" style="display: none; margin-top: 20px; text-align: center;">
                <div id="ownerNameDisplay" style="color: #d4af37; font-weight: 600; margin-bottom: 10px;"></div>
                <div id="ownerPinDisplay" style="color: #fff; font-size: 24px; font-weight: 800;"></div>
            </div>
        </div>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://ctzdiiyzoocxmlmeagtt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0emRpaXl6b29jeG1sbWVhZ3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMjI1NTEsImV4cCI6MjEwMjY5ODU1MX0.Jy_T5XaI5CI4qfFVH7b53MDCurR2olh0a6Tx9BzDOGw';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
    
    <!-- JavaScript -->
    <script src="auth.js"></script>
    <script src="service-worker-register.js"></script>
    <script>
        // Load footer from Supabase
        async function loadFooter() {
            try {
                const { data: footer, error } = await supabaseClient
                    .from('footer')
                    .select('*')
                    .limit(1)
                    .single();
                
                const footerContent = document.getElementById('footerContent');
                
                if (footer) {
                    footerContent.innerHTML = 
                        '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">' +
                        (footer.mawasiliano || '') +
                        '</p>' +
                        (footer.email ? '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">📧 ' + footer.email + '</p>' : '') +
                        (footer.phone ? '<p style="color: #94a3b8; font-size: 12px; margin-bottom: 4px;">📞 ' + footer.phone + '</p>' : '') +
                        '<p style="color: #94a3b8; font-size: 12px; margin-top: 8px;">' +
                        (footer.copyright || '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis') +
                        '</p>';
                } else {
                    footerContent.innerHTML = 
                        '<p style="color: #94a3b8; font-size: 12px;">' +
                        '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis' +
                        '</p>';
                }
            } catch (e) {
                console.log('Footer not found, using default');
                document.getElementById('footerContent').innerHTML = 
                    '<p style="color: #94a3b8; font-size: 12px;">' +
                    '© 2026 KMCA - Kwaya ya Vijana Mtakatifu Carlo Acutis' +
                    '</p>';
            }
        }
        
        // Call loadFooter on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadFooter();
        });
    </script>
</body>
</html>
